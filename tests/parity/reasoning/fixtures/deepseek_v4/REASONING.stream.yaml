family: deepseek_v4
model_label: DeepSeek V4
mode: stream
cases:
  REASONING.stream.1:
    description: Single reasoning block across chunks
    chunks:
    - <think>thin
    - king</think>answer
    expected:
      dynamo: &d_s1
        reasoning_text: thinking
        normal_text: answer
      vllm: *d_s1
      sglang: *d_s1
  REASONING.stream.3:
    description: End marker split across chunks
    chunks:
    - <think>thinking</th
    - ink>answer
    expected:
      dynamo: &d_s3
        reasoning_text: thinking
        normal_text: answer
      vllm: *d_s3
      sglang: *d_s3
