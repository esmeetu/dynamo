family: mistral
model_label: Mistral / Magistral
mode: stream
cases:
  REASONING.stream.1:
    description: Mistral THINK block across chunks
    chunks:
    - '[THINK]thin'
    - 'king[/THINK]answer'
    expected:
      dynamo: &d_s1
        reasoning_text: thinking
        normal_text: answer
      vllm: *d_s1
      sglang:
        unavailable: SGLang peer not wired for Dynamo parser family 'mistral'
  REASONING.stream.3:
    description: End marker split across chunks
    chunks:
    - '[THINK]thinking[/TH'
    - 'INK]answer'
    expected:
      dynamo: &d_s3
        reasoning_text: thinking
        normal_text: answer
      vllm: *d_s3
      sglang:
        unavailable: SGLang peer not wired for Dynamo parser family 'mistral'
